        ::selection { background: var(--red); color: var(--ink); }

        .nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            padding: 16px 5vw;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font: 800 21px var(--head);
            letter-spacing: -.02em;
            color: var(--ink);
            text-decoration: none;
        }
        .brand i {
            width: 13px; height: 13px;
            border-radius: 50%;
            background: var(--red);
            box-shadow: 0 0 0 5px rgba(178,8,8,.22);
        }

        .card {
            position: relative;
            z-index: 1;
            width: 400px;
            max-width: 90%;
            padding: 40px;
            border-radius: 24px;
            background: transparent;
            border: none;
            box-shadow: none;
            text-shadow: 0 2px 12px rgba(0,0,0,.45);
            text-align: center;
            animation: card-in .7s cubic-bezier(.2,.9,.3,1.2) both;
        }
        @keyframes card-in {
            from { opacity: 0; transform: translateY(26px) scale(.96); }
            to   { opacity: 1; transform: none; }
        }

        .logo {
            font-family: var(--head);
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -.03em;
            color: var(--ink);
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--khaki);
            font: 800 13px var(--head);
            letter-spacing: .12em;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .lead {
            margin-bottom: 15px;
            color: var(--muted);
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 999px;
            border: 1px solid var(--khaki);
            background: #F6EBE3;
            color: var(--deep);
            font: 400 18px var(--body);
            text-align: center;
            outline: none;
            transition: border-color .25s, box-shadow .25s;
        }
        input::placeholder { color: #8f7a6c; }
        input:focus {
            border-color: var(--cream);
            box-shadow: 0 0 0 5px rgba(237,217,204,.25);
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 15px;
            border: none;
            border-radius: 999px;
            background: var(--cream);
            color: var(--dark);
            font: 700 15px var(--head);
            cursor: pointer;
            transition: transform .25s, box-shadow .25s, background .25s, color .25s;
        }

        button:hover:not(:disabled) {
            background: var(--red);
            color: var(--ink);
            transform: translateY(-3px);
            box-shadow: 0 14px 30px rgba(46,21,18,.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        a:focus-visible, button:focus-visible, input:focus-visible {
            outline: 2px solid var(--cream);
            outline-offset: 3px;
        }

        /* status text keeps its script-set colours; the dark chip keeps them readable */
        #message {
            margin-top: 18px;
            min-height: 22px;
            font-size: 14px;
            border-radius: 12px;
        }
        #message:not(:empty) {
            padding: 10px 14px;
            background: var(--deep);
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: var(--muted);
            font-size: 13px;
            text-decoration: none;
            transition: color .25s;
        }
        .back:hover { color: #fff; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>

<body>

    <header class="nav">
        <a class="brand" href="engineer (1).html"><i></i>RailSense</a>
    </header>

    <div class="card">

        <div class="logo">RAILSENSE</div>

        <div class="subtitle">
            Engineer Access
        </div>

        <p class="lead">
            Enter the engineer secret code to continue.
        </p>

        <input
            type="password"
            id="secretCode"
            placeholder="Enter secret code"
            autocomplete="off"
        >

        <button id="accessButton" onclick="verifyEngineer()">
            Access Engineer Dashboard
        </button>

        <div id="message"></div>

        <a class="back" href="engineer (1).html">
            ← Back to RailSense
        </a>

    </div>


    <script>

        async function verifyEngineer() {

            const codeInput = document.getElementById("secretCode");
            const message = document.getElementById("message");
            const button = document.getElementById("accessButton");

            const code = codeInput.value.trim();

            // Check empty code
            if (!code) {

                message.textContent = "Please enter the secret code.";
                message.style.color = "#f59e0b";

                return;
            }

            // Disable button while checking
            button.disabled = true;
            button.textContent = "Verifying...";

            message.textContent = "Checking engineer access...";
            message.style.color = "#94a3b8";

            try {

                const response = await fetch(
                    "http://127.0.0.1:5000/api/engineer/verify",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            code: code
                        })
                    }
                );

                // Get server response
                const result = await response.json();

                console.log("Server response:", result);

                if (response.ok && result.ok) {

                    message.textContent =
                        "Access granted. Opening dashboard...";

                    message.style.color = "#22c55e";

                    // Open engineer dashboard
                    setTimeout(function() {

                        window.location.href = "engineer.html";

                    }, 500);

                } else {

                    message.textContent =
                        result.message || "Invalid secret code.";

                    message.style.color = "#ef4444";

                    button.disabled = false;
                    button.textContent = "Access Engineer Dashboard";
                }

            } catch (error) {

                console.error("Engineer verification error:", error);

                message.textContent =
                    "Unable to connect to the RailSense server.";

                message.style.color = "#ef4444";

                button.disabled = false;
                button.textContent = "Access Engineer Dashboard";
            }
        }


        // Allow ENTER key to submit
        document.getElementById("secretCode").addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    verifyEngineer();

                }

            }
        );

    </script>

</body>
</html>
