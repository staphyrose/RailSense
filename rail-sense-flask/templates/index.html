/* card: transparent, text sits directly on the photo */
body > div[style] > div{
  position:relative;z-index:1;
  max-width:400px !important;padding:40px !important;
  border-radius:24px !important;background:transparent !important;border:none;
  box-shadow:none !important;text-shadow:0 2px 12px rgba(0,0,0,.45);
  animation:card-in .7s cubic-bezier(.2,.9,.3,1.2) both;
}
@keyframes card-in{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}

/* brand row */
body > div[style] > div > div:first-child > div{
  background:var(--red) !important;border-radius:50% !important;
  width:13px !important;height:13px !important;box-shadow:0 0 0 5px rgba(178,8,8,.35);
}
body > div[style] > div > div:first-child > div > span{display:none !important}
body > div[style] > div > div:first-child > span{
  font:800 21px var(--head) !important;letter-spacing:-.02em !important;color:var(--ink) !important;
}

/* role toggle */
body > div[style] > div > div:nth-child(2){background:rgba(237,217,204,.16) !important;border-radius:999px}
#role-user{background:var(--cream) !important;color:var(--dark) !important;font-family:var(--head);font-weight:700;box-shadow:none}

/* headings + copy */
#form-title,#success-title{font-family:var(--head) !important;font-weight:800 !important;letter-spacing:-.03em !important;color:var(--ink) !important}
#form-title{font-size:26px !important}
#success-sub,#switch-prompt,.text-slate-500,.text-slate-600{color:var(--muted) !important}

/* input pills */
#auth-form .rounded-full{border-color:var(--khaki) !important;background:#F6EBE3 !important;transition:border-color .25s,box-shadow .25s;text-shadow:none}
#auth-form .rounded-full:focus-within{border-color:var(--cream) !important;box-shadow:0 0 0 5px rgba(237,217,204,.25)}
#auth-form input[type=text],#auth-form input[type=tel],#auth-form input[type=password]{color:var(--deep) !important}
#auth-form input::placeholder{color:#8f7a6c !important}
#auth-form input[type=checkbox]{accent-color:var(--red);border-color:var(--khaki)}
#auth-form [data-icon],#toggle-pw{color:var(--coyote) !important}
.text-rose-500{color:#FFB3B8 !important}
[data-rule].text-slate-400{color:var(--muted) !important;opacity:.75}
[data-rule].text-emerald-600{color:#8be0b8 !important;opacity:1}
#sms-opt{background:rgba(237,217,204,.14) !important;border-radius:16px}
#sms-opt,#sms-opt .text-slate-800,#sms-opt .text-slate-700{color:var(--ink) !important}
#success-view [data-icon="check-circle-2"]{color:#8be0b8 !important}
#sms-box{background:rgba(46,21,18,.55) !important;border-color:rgba(237,217,204,.25) !important;border-radius:18px}
#sms-box p.text-slate-500,#sms-box .text-slate-500{color:var(--muted) !important}

/* links + buttons */
#forgot-row button,#switch-mode{color:var(--cream) !important;font-weight:700}
#forgot-row button:hover,#switch-mode:hover{color:#fff !important}
#submit-btn{
  background:var(--cream) !important;color:var(--dark) !important;border-radius:999px !important;padding:15px !important;
  font:700 15px var(--head) !important;box-shadow:none !important;text-shadow:none;
  transition:transform .25s,box-shadow .25s,background .25s,color .25s !important;
}
#submit-btn:hover{opacity:1 !important;background:var(--red) !important;color:var(--ink) !important;transform:translateY(-3px);box-shadow:0 14px 30px rgba(46,21,18,.3) !important}
#back-btn{color:var(--muted) !important}
#back-btn:hover{color:#fff !important}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--cream);outline-offset:3px}

@media(max-width:480px){
  body > div[style] > div{padding:30px 22px !important}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>

      <span class="text-[15px] font-semibold tracking-tight text-slate-800">Rail Sense</span>
    </div>

    <div class="mb-6 flex rounded-full bg-slate-100 p-1 text-[13.5px] font-medium">
      <button id="role-user" class="flex-1 rounded-full py-2 transition">Commuter</button>
    </div>

    <div id="success-view" class="hidden flex-col items-center py-4 text-center">
      <span data-icon="check-circle-2" class="mb-3" style="width:38px;height:38px;color:#10b981;"></span>
      <h2 id="success-title" class="text-lg font-semibold text-slate-800"></h2>
      <p id="success-sub" class="mt-1 text-[13.5px] text-slate-500"></p>
      <div id="sms-box" class="mt-5 hidden w-full rounded-xl border border-slate-200 bg-slate-50 p-3.5 text-left">
        <p class="mb-2 flex items-center gap-1.5 text-[12px] font-medium text-slate-500">
          <span data-icon="bell-ring" style="width:13px;height:13px;"></span>
          <span id="sms-target"></span>
        </p>
        <div class="space-y-2">
          <p class="rounded-lg bg-white px-3 py-2 text-[12.5px] text-slate-700 shadow-sm">Your 6:10 AM local is running 20 min late — signal fault near Sector 4.</p>
          <p class="rounded-lg bg-white px-3 py-2 text-[12.5px] text-slate-700 shadow-sm">Platform change: the 7:45 AM Express now departs from Platform 3.</p>
        </div>
      </div>
      <button id="back-btn" class="mt-6 flex items-center gap-1 text-[13.5px] font-medium text-slate-500 hover:text-slate-700">
        <span data-icon="arrow-left" style="width:14px;height:14px;"></span> Back
      </button>
    </div>

    <div id="form-view">
      <h1 id="form-title" class="mb-5 text-center text-[22px] font-semibold text-slate-900">Sign In</h1>

      <form id="auth-form" class="space-y-3.5" novalidate>
        <div>
          <div id="identifier-pill" class="flex items-center gap-2.5 rounded-full border border-slate-200 bg-white px-4 py-3 transition">
            <span data-icon="mail" class="text-slate-400" style="width:17px;height:17px;"></span>
            <input id="identifier" type="text" placeholder="Phone / Email ID" class="w-full bg-transparent text-[15px] text-slate-800 outline-none placeholder:text-slate-400" />
          </div>
          <p id="identifier-error" class="mt-1.5 pl-1 text-[12.5px] font-medium text-rose-500 hidden"></p>
        </div>

        <div id="name-field" class="hidden">
          <div class="flex items-center gap-2.5 rounded-full border border-slate-200 bg-white px-4 py-3">
            <span data-icon="user" class="text-slate-400" style="width:17px;height:17px;"></span>
            <input id="name" type="text" placeholder="Full Name" class="w-full bg-transparent text-[15px] text-slate-800 outline-none placeholder:text-slate-400" />
          </div>
          <p id="name-error" class="mt-1.5 pl-1 text-[12.5px] font-medium text-rose-500 hidden"></p>
        </div>

        <div id="zone-field" class="hidden">
          <div class="flex items-center gap-2.5 rounded-full border border-slate-200 bg-white px-4 py-3">
            <span data-icon="shield-check" class="text-slate-400" style="width:17px;height:17px;"></span>
            <input id="zone" type="text" placeholder="Zone / Division" class="w-full bg-transparent text-[15px] text-slate-800 outline-none placeholder:text-slate-400" />
          </div>
          <p id="zone-error" class="mt-1.5 pl-1 text-[12.5px] font-medium text-rose-500 hidden"></p>
        </div>

        <div id="phone-field" class="hidden">
          <div id="phone-pill" class="flex items-center gap-2.5 rounded-full border border-slate-200 bg-white px-4 py-3">
            <span data-icon="phone" class="text-slate-400" style="width:17px;height:17px;"></span>
            <input id="phone" type="tel" maxlength="10" placeholder="10-digit mobile number" class="w-full bg-transparent text-[15px] text-slate-800 outline-none placeholder:text-slate-400" />
          </div>
          <p id="phone-error" class="mt-1.5 pl-1 text-[12.5px] font-medium text-rose-500 hidden"></p>
        </div>

        <div>
          <div class="flex items-center gap-2.5 rounded-full border border-slate-200 bg-white px-4 py-3">
            <span data-icon="lock" class="text-slate-400" style="width:17px;height:17px;"></span>
            <input id="password" type="password" placeholder="Password" class="w-full bg-transparent text-[15px] text-slate-800 outline-none placeholder:text-slate-400" />
            <button type="button" id="toggle-pw" class="text-slate-400 hover:text-slate-600">
              <span data-icon="eye" style="width:16px;height:16px;"></span>
            </button>
          </div>
          <div id="password-checklist" class="mt-1.5 hidden grid grid-cols-1 gap-1 pl-1 sm:grid-cols-2 text-[12px]">
            <p data-rule="length" class="flex items-center gap-1.5 text-slate-400"><span data-icon="check-circle-2" style="width:13px;height:13px;"></span>At least 8 characters</p>
            <p data-rule="upper" class="flex items-center gap-1.5 text-slate-400"><span data-icon="check-circle-2" style="width:13px;height:13px;"></span>One uppercase letter</p>
            <p data-rule="lower" class="flex items-center gap-1.5 text-slate-400"><span data-icon="check-circle-2" style="width:13px;height:13px;"></span>One lowercase letter</p>
            <p data-rule="number" class="flex items-center gap-1.5 text-slate-400"><span data-icon="check-circle-2" style="width:13px;height:13px;"></span>One number</p>
            <p data-rule="special" class="flex items-center gap-1.5 text-slate-400"><span data-icon="check-circle-2" style="width:13px;height:13px;"></span>One special character</p>
          </div>
          <p id="password-error" class="mt-1.5 pl-1 text-[12.5px] font-medium text-rose-500 hidden"></p>
        </div>

        <label id="sms-opt" class="hidden flex items-start gap-2 rounded-xl bg-amber-50 p-3 text-[12.5px] text-slate-700">
          <input id="smsAlerts" type="checkbox" checked class="mt-0.5 h-4 w-4 rounded border-slate-300" />
          <span>
            <span class="flex items-center gap-1.5 font-medium text-slate-800">
              <span data-icon="bell-ring" style="width:13px;height:13px;"></span> Send SMS alerts to this number
            </span>
            Get a text when your saved trains are delayed or change platform.
          </span>
        </label>

        <div id="terms-field" class="hidden">
          <label class="flex items-start gap-2 pl-1 text-[12.5px] text-slate-600">
            <input id="agree" type="checkbox" class="mt-0.5 h-4 w-4 rounded border-slate-300" />
            <span>I have read and agree to the User Agreement &amp; Privacy Policy.</span>
          </label>
          <p id="agree-error" class="mt-1.5 pl-1 text-[12.5px] font-medium text-rose-500 hidden"></p>
        </div>

        <div id="forgot-row" class="flex justify-end pt-0.5">
          <button type="button" class="text-[12.5px] font-medium" style="color:#146873;">Forgotten password?</button>
        </div>

        <button type="submit" id="submit-btn" class="w-full rounded-full py-3 text-[15px] font-semibold text-white shadow-md transition hover:opacity-95"
                style="background: linear-gradient(90deg, #146873, #1E8A7E);">Sign In</button>
      </form>

      <p class="mt-5 text-center text-[13.5px] text-slate-500">
        <span id="switch-prompt">New to Rail Sense?</span>
        <button id="switch-mode" class="font-semibold" style="color:#146873;">Register</button>
      </p>
    </div>

  </div>
</div>

<script>
const ICONS = {
  "train": '<path d="M4 11h16M8 3h8a2 2 0 0 1 2 2v10a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V5a2 2 0 0 1 2-2Z"/><path d="M8 19l-2 3M16 19l2 3"/>',
  "mail": '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  "user": '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  "shield-check": '<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4"/>',
  "phone": '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/>',
  "lock": '<rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  "eye": '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
  "eye-off": '<path d="M3 3l18 18"/><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.5 6.6A17 17 0 0 0 2 12s3.5 7 10 7a10.4 10.4 0 0 0 4.2-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
  "check-circle-2": '<circle cx="12" cy="12" r="9"/><path d="m9 12 2 2 4-4"/>',
  "bell-ring": '<path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M10 21a2 2 0 0 0 4 0"/><path d="M3 4a12 12 0 0 1 2.5 3M21 4a12 12 0 0 0-2.5 3"/>',
  "arrow-left": '<path d="M19 12H5M11 6l-6 6 6 6"/>',
};

function renderIcons() {
  document.querySelectorAll("[data-icon]").forEach((span) => {
    const name = span.getAttribute("data-icon");
    const inner = ICONS[name];
    if (!inner) return;
    span.innerHTML = `<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
    span.style.display = "inline-flex";
  });
}

const state = { role: "user", mode: "login" };

const COPY = {
  user: { label: "Commuter", loginTitle: "Sign In", signupTitle: "Sign Up", idPlaceholder: "Phone / Email ID" },
};

const el = (id) => document.getElementById(id);
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const isDigits = (s) => /^\d+$/.test(s);

function validateIdentifier(value) {
  if (!value.trim()) return "This field is required.";
  if (isDigits(value)) return value.length === 10 ? "" : "Phone number must be exactly 10 digits.";
  return EMAIL_RE.test(value) ? "" : "Enter a valid email address.";
}
function validatePhone(value) {
  if (!value) return "Mobile number is required.";
  if (!isDigits(value)) return "Only digits, please.";
  if (value.length !== 10) return "Phone number must be exactly 10 digits.";
  return "";
}
function passwordChecks(value) {
  return {
    length: value.length >= 8,
    upper: /[A-Z]/.test(value),
    lower: /[a-z]/.test(value),
    number: /\d/.test(value),
    special: /[^A-Za-z0-9]/.test(value),
  };
}
function updatePasswordChecklist() {
  const checks = passwordChecks(el("password").value);
  Object.entries(checks).forEach(([key, passed]) => {
    const p = document.querySelector(`[data-rule="${key}"]`);
    p.classList.toggle("text-emerald-600", passed);
    p.classList.toggle("text-slate-400", !passed);
  });
}
function showError(id, msg) {
  const p = el(id);
  if (msg) { p.textContent = msg; p.classList.remove("hidden"); }
  else { p.classList.add("hidden"); }
}

function render() {
  const copy = COPY[state.role];
  const isSignup = state.mode === "signup";

  el("role-user").classList.toggle("bg-white", state.role === "user");
  el("role-user").classList.toggle("text-slate-900", state.role === "user");
  el("role-user").classList.toggle("shadow-sm", state.role === "user");
  el("role-user").classList.toggle("text-slate-500", state.role !== "user");
    el("form-title").textContent = isSignup ? copy.signupTitle : copy.loginTitle;
  el("identifier").placeholder = copy.idPlaceholder;

  el("name-field").classList.toggle("hidden", !isSignup);
  el("zone-field").classList.add("hidden");
  el("phone-field").classList.toggle("hidden", !isSignup);
  el("password-checklist").classList.toggle("hidden", !isSignup);
  el("sms-opt").classList.toggle("hidden", !isSignup);
  el("sms-opt").classList.toggle("flex", isSignup);
  el("terms-field").classList.toggle("hidden", !isSignup);
  el("forgot-row").classList.toggle("hidden", isSignup);
  el("submit-btn").textContent = isSignup ? "Continue" : "Sign In";
  el("switch-prompt").textContent = isSignup ? "Joined us before?" : "New to Rail Sense?";
  el("switch-mode").textContent = isSignup ? "Sign In" : "Register";

  renderIcons();
}

el("role-user").onclick = () => { state.role = "user"; render(); };
el("switch-mode").onclick = () => { state.mode = state.mode === "login" ? "signup" : "login"; render(); };

el("toggle-pw").onclick = () => {
  const input = el("password");
  const showing = input.type === "text";
  input.type = showing ? "password" : "text";
  el("toggle-pw").querySelector("[data-icon]").setAttribute("data-icon", showing ? "eye" : "eye-off");
  renderIcons();
};
el("password").addEventListener("input", updatePasswordChecklist);

el("identifier").addEventListener("blur", () => {
  showError("identifier-error", validateIdentifier(el("identifier").value));
});
el("phone").addEventListener("blur", () => {
  if (el("phone").value) showError("phone-error", validatePhone(el("phone").value));
});

el("back-btn").onclick = () => {
  el("success-view").classList.add("hidden");
  el("success-view").classList.remove("flex");
  el("form-view").classList.remove("hidden");
  el("auth-form").reset();
  render();
};

el("auth-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const isSignup = state.mode === "signup";
  const payload = {
    identifier: el("identifier").value,
    password: el("password").value,
    name: el("name").value,
    zone: el("zone").value,
    phone: el("phone").value,
    smsAlerts: el("smsAlerts").checked,
    agree: el("agree").checked,
  };

  ["identifier-error", "name-error", "zone-error", "phone-error", "password-error", "agree-error"].forEach((id) => showError(id, ""));

  if (isSignup) {
    const phoneError = validatePhone(payload.phone);
    if (phoneError) {
      showError("phone-error", phoneError);
      return;
    }
  }

  const endpoint = isSignup ? "/api/signup" : "/api/login";
  const res = await fetch(endpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  const data = await res.json();

  if (!data.ok) {
    Object.entries(data.errors).forEach(([field, msg]) => showError(`${field}-error`, msg));
    return;
  }

  if (!isSignup && data.redirect) {
    window.location.href = data.redirect;
    return;
  }

  el("form-view").classList.add("hidden");
  el("success-view").classList.remove("hidden");
  el("success-view").classList.add("flex");
  el("success-title").textContent = isSignup ? "Account created" : "Signed in";
  el("success-sub").textContent = data.message;

  const smsChecked = el("smsAlerts").checked;
  if (isSignup && smsChecked) {
    el("sms-box").classList.remove("hidden");
    el("sms-target").textContent = "SMS alerts to " + (payload.phone || payload.identifier);
  } else {
    el("sms-box").classList.add("hidden");
  }
  renderIcons();
});

render();
renderIcons();
</script>
</body>
</html>
