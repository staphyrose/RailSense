<div class="card">

    <div class="logo">RAILSENSE</div>

    <div class="subtitle">
        Engineer Access
    </div>

    <p style="margin-bottom: 15px;">
        Enter the engineer secret code to continue.
    </p>

    <input
        type="password"
        id="secretCode"
        placeholder="Enter secret code"
        autocomplete="off"
    >

    <button id="accessButton" onclick="verifyEngineer()">
        Access Engineer Dashboard
    </button>

    <div id="message"></div>

    <a
        class="back"
        href="http://127.0.0.1:5000/"
    >
        ← Back to RailSense
    </a>

</div>


<script>

    async function verifyEngineer() {

        const codeInput = document.getElementById("secretCode");
        const message = document.getElementById("message");
        const button = document.getElementById("accessButton");

        const code = codeInput.value.trim();

        // ---------------------------------------------
        // CHECK EMPTY CODE
        // ---------------------------------------------

        if (!code) {

            message.textContent =
                "Please enter the secret code.";

            message.style.color = "#f59e0b";

            return;
        }


        // ---------------------------------------------
        // DISABLE BUTTON WHILE VERIFYING
        // ---------------------------------------------

        button.disabled = true;
        button.textContent = "Verifying...";

        message.textContent =
            "Checking engineer access...";

        message.style.color = "#94a3b8";


        // ---------------------------------------------
        // SEND CODE TO FLASK
        // ---------------------------------------------

        try {

            const response = await fetch(
                "http://127.0.0.1:5000/api/engineer/verify",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        code: code
                    })
                }
            );


            // -----------------------------------------
            // READ SERVER RESPONSE
            // -----------------------------------------

            const result = await response.json();

            console.log(
                "Engineer verification response:",
                result
            );


            // -----------------------------------------
            // CORRECT CODE
            // -----------------------------------------

            if (response.ok && result.ok) {

                message.textContent =
                    "Access granted. Opening dashboard...";

                message.style.color = "#22c55e";


                // -------------------------------------
                // OPEN FLASK ENGINEER DASHBOARD
                // -------------------------------------

                setTimeout(function () {

                    window.location.href =
                        "http://127.0.0.1:5000/engineer";

                }, 500);

            }


            // -----------------------------------------
            // WRONG CODE
            // -----------------------------------------

            else {

                message.textContent =
                    result.message ||
                    "Invalid secret code.";

                message.style.color = "#ef4444";

                button.disabled = false;

                button.textContent =
                    "Access Engineer Dashboard";
            }

        }


        // ---------------------------------------------
        // SERVER CONNECTION ERROR
        // ---------------------------------------------

        catch (error) {

            console.error(
                "Engineer verification error:",
                error
            );

            message.textContent =
                "Unable to connect to the RailSense server.";

            message.style.color = "#ef4444";

            button.disabled = false;

            button.textContent =
                "Access Engineer Dashboard";
        }
    }


    // ---------------------------------------------
    // ENTER KEY SUPPORT
    // ---------------------------------------------

    document
        .getElementById("secretCode")
        .addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {

                    verifyEngineer();

                }

            }
        );

</script>
